name: "x86_64-linux package build"

on:
  push:

jobs:
  pkg:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - uses: cachix/cachix-action@v14
      with:
        name: iliketocode
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    - run: nix flake show --json | jq  '.packages."x86_64-linux"|keys[]'| xargs -I {} nix build .#{} --print-build-logs --extra-experimental-features "flakes nix-command"